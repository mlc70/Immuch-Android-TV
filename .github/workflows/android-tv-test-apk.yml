name: Android TV APK

# A standalone build for our Android TV development branch.
# Personal signing secrets keep upgrades compatible. No upstream release runners.
on:
  push:
    branches:
      - feature/android-tv-permanent
    paths:
      - 'mobile/**'
      - 'native/**'
      - 'open-api/**'
      - 'i18n/**'
      - 'mise.toml'
      - '.github/workflows/android-tv-test-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-tv-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android TV test APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      MISE_YES: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      # Stable identity: com.aprogsys.immuch360.tvtest
      # Never rotate this identity without an explicit app-data migration plan.
      TV_SIGNER_SHA256: '822dd1fd322642aa8fd56f790de7ac1345aab52c542647492d86455fad667d3d'
      IMMUCH_TV_TEST_BUILD: 'true'

    steps:
      - name: Check out development code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          install: false
          cache: true

      - name: Install required toolchains
        run: |
          mise install node java "npm:@openapitools/openapi-generator-cli"
          cd mobile
          mise install
          mise exec -- flutter --version

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Configure persistent signing for test upgrades
        env:
          TV_TEST_KEYSTORE_BASE64: ${{ secrets.TV_TEST_KEYSTORE_BASE64 }}
          TV_TEST_KEYSTORE_PASSWORD: ${{ secrets.TV_TEST_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$TV_TEST_KEYSTORE_BASE64" && -z "$TV_TEST_KEYSTORE_PASSWORD" ]]; then
            echo "::error::Permanent TV signing is required. Configure TV_TEST_KEYSTORE_BASE64 and TV_TEST_KEYSTORE_PASSWORD; temporary signing is disabled."
            exit 1
          elif [[ -z "$TV_TEST_KEYSTORE_BASE64" || -z "$TV_TEST_KEYSTORE_PASSWORD" ]]; then
            echo "::error::Both TV_TEST_KEYSTORE_BASE64 and TV_TEST_KEYSTORE_PASSWORD must be configured together."
            exit 1
          else
            umask 077
            printf '%s' "$TV_TEST_KEYSTORE_BASE64" | base64 --decode > mobile/android/key.jks
            test -s mobile/android/key.jks
            mise exec -- keytool -list -keystore mobile/android/key.jks -alias tvtest -storepass "$TV_TEST_KEYSTORE_PASSWORD" >/dev/null
            signer_sha=$(mise exec -- keytool -exportcert -keystore mobile/android/key.jks -alias tvtest -storepass "$TV_TEST_KEYSTORE_PASSWORD" | sha256sum | cut -d ' ' -f 1)
            if [[ "$signer_sha" != "$TV_SIGNER_SHA256" ]]; then
              echo "::error::Signing certificate does not match this fork's permanent identity."
              exit 1
            fi
            echo "ALIAS=tvtest" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$TV_TEST_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_STORE_PASSWORD=$TV_TEST_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "TV_TEST_SIGNING_MODE=persistent" >> "$GITHUB_ENV"
          fi

      - name: Install Flutter dependencies and generate code
        run: |
          mise //mobile:install:ci
          mise //mobile:codegen

      - name: Test Search filter TV navigation
        working-directory: mobile
        run: mise exec -- flutter test test/widgets/search/search_filter test/presentation/widgets/search/tv_date_range_test.dart test/presentation/widgets/tv/tv_search_choice_test.dart test/presentation/widgets/tv/tv_filter_list_test.dart

      - name: Analyze modified Search filters
        working-directory: mobile
        run: mise exec -- dart analyze lib/widgets/search/search_filter lib/widgets/common/tag_picker.dart lib/services/search.service.dart lib/providers/search/search_filter.provider.dart lib/presentation/pages/search/search.page.dart lib/presentation/widgets/search/tv_date_range.dart lib/presentation/widgets/search/tv_text_search_mode.dart lib/presentation/widgets/tv

      - name: Test photo date/time preference
        working-directory: mobile
        run: mise exec -- flutter test test/domain/models/config/tv_photo_date_setting_test.dart

      - name: Test photo D-pad zoom and pan at TV resolution
        working-directory: mobile
        run: mise exec -- flutter test test/presentation/widgets/tv/tv_photo_zoom_test.dart test/presentation/widgets/tv/tv_photo_actions_test.dart

      - name: Analyze TV photo actions and viewer integration
        working-directory: mobile
        run: mise exec -- dart analyze lib/presentation/widgets/tv/tv_photo_actions.dart lib/presentation/widgets/tv/tv_photo_actions_api.dart lib/presentation/widgets/asset_viewer/asset_viewer.page.dart lib/widgets/common/search_field.dart

      - name: Test retained TV login, cache and video behavior
        working-directory: mobile
        run: mise exec -- flutter test test/widgets/forms/login_form_tv_test.dart test/data/store/util/cache_test.dart test/domain/services/video_source_policy_test.dart test/providers/asset_viewer/video_source_provider_test.dart test/widgets/asset_viewer/video_controls_keys_test.dart

      - name: Test visible build identification
        working-directory: mobile
        run: mise exec -- flutter test --dart-define=TV_BRANCH=feature/test --dart-define=TV_COMMIT=0123456789abcdef --dart-define=TV_BUILD=42 test/presentation/widgets/tv/tv_build_identity_test.dart

      - name: Build independently installable release APK
        working-directory: mobile
        run: |
          mise exec -- flutter build apk --release --flavor tv --dart-define=IMMUCH_TV_ONLY=true --dart-define=TV_BRANCH=${GITHUB_REF_NAME} --dart-define=TV_COMMIT=${GITHUB_SHA} --dart-define=TV_BUILD=${GITHUB_RUN_NUMBER} --build-name "3.3.0-tv.${GITHUB_RUN_NUMBER}" --build-number "$((3030021 + GITHUB_RUN_NUMBER))"

      - name: Stage test APK
        run: |
          set -euo pipefail
          mkdir -p dist
          cp mobile/build/app/outputs/flutter-apk/app-tv-release.apk "dist/Immuch-Android-TV-r${GITHUB_RUN_NUMBER}.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "dist/Immuch-Android-TV-r${GITHUB_RUN_NUMBER}.apk" | tee dist/signing-verification.txt
          grep -F "Signer #1 certificate SHA-256 digest: ${TV_SIGNER_SHA256}" dist/signing-verification.txt
          sha256sum dist/*.apk

      - name: Upload APK for testing
        uses: actions/upload-artifact@v4
        with:
          name: Immuch-Android-TV-r${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Installation instructions
        if: success()
        run: |
          echo '### Android TV test APK built successfully' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download **Immuch-Android-TV-r${{ github.run_number }}** from the Artifacts section of this run.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Unzip it and install **Immuch-Android-TV-r${GITHUB_RUN_NUMBER}.apk**.' >> "$GITHUB_STEP_SUMMARY"
          echo "The package is **com.aprogsys.immuch360.tvtest**, label **Immuch Android TV**. Build run: ${GITHUB_RUN_NUMBER}." >> "$GITHUB_STEP_SUMMARY"
          echo "Signing mode: **${TV_TEST_SIGNING_MODE}**" >> "$GITHUB_STEP_SUMMARY"
          echo 'To preserve login/settings, upgrade only with the same signing certificate. If Android rejects the signature, keep the installed app and configure persistent signing before upgrading.' >> "$GITHUB_STEP_SUMMARY"
          echo 'It should install alongside normal Immuch360, not replace it.' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
